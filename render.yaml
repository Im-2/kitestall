# Render FREE plan: no persistent disk. SQLite lives in /tmp (ephemeral) and is re-seeded on every boot;
# real settled sales are re-imported from docs/history.json; receipts are self-contained and signed.
services:
  - type: web
    name: kitestall
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: false   # manual deploys only: avoids burning free build minutes and surprise restarts during judging
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: DATABASE_PATH, value: /tmp/kitestall.db }
      - { key: SERV_BASE_URL, value: "https://inference-api.openserv.ai/v1" }
      - { key: SERV_MODEL_NEGOTIATE, value: gpt-5.4-mini }
      - { key: SERV_MODEL_COMPILE, value: gpt-5.4-mini }
      - { key: SERV_MODE, value: live }
      - { key: SERV_SHADOW, value: "0" }   # Shadow Agent stays OFF; Prompt Guard is always on
      # HARD SERV budget ($2 topped up, no more). Estimated spend is persisted in SQLite; over a cap the shop uses the labeled deterministic fallback.
      - { key: SERV_DAILY_BUDGET_USD, value: "0.50" }
      - { key: SERV_TOTAL_BUDGET_USD, value: "1.70" }
      - { key: SERV_COST_MULTIPLIER, value: "3" }
      - { key: SERV_ASSUMED_SPENT_ON_RESET_USD, value: "0.15" }
      - { key: SESSION_MAX_CALLS, value: "8" }
      - { key: IP_DAILY_CALLS, value: "30" }
      - { key: GLOBAL_SERV_CALLS_PER_MIN, value: "25" }
      - { key: DEMO_RUNS_PER_DAY, value: "8" }
      - { key: FIRM_QUOTE_FEE_CENTS, value: "5" }
      - { key: FIRM_QUOTE_TTL_SECONDS, value: "600" }
      - { key: DEMO_SHADOW, value: "1" }   # Shadow Agent only for the demo shopper on accept/final rounds (set 0 to disable)
      - { key: KITE_NETWORK, value: kite-testnet }
      - { key: KITE_FACILITATOR_URL, value: "https://facilitator.pieverse.io" }
      - { key: KITE_EXPLORER_BASE, value: "https://testnet.kitescan.ai" }
      - { key: PLATFORM_FEE_BPS, value: "100" }
      - { key: QUOTE_FEE_CENTS, value: "1" }
      - { key: FREE_QUOTES_PER_DAY, value: "10" }
      # Secrets / per-deploy values: paste in the Render dashboard (values are NOT stored in git)
      - { key: PUBLIC_BASE_URL, sync: false }
      - { key: OPENSERV_API_KEY, sync: false }
      - { key: OWNER_TOKEN, sync: false }
      - { key: SHOP_WALLET_ADDRESS_NOMAD, sync: false }
      - { key: SHOP_WALLET_ADDRESS_BRIGHTBEAN, sync: false }
      - { key: DEMO_SHOPPER_PRIVATE_KEY, sync: false }
      - { key: PLATFORM_WALLET_ADDRESS, sync: false }   # receives the 5-cent firm-quote fee (testnet)
      - { key: SHOP_SIGNING_KEYS, sync: false }
